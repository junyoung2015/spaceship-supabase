name: "Private security contact request"
description: "Request a private reporting route without disclosing any vulnerability details."
title: "security-contact: private reporting route requested"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this public form only when GitHub private vulnerability reporting is unavailable and you have no established private channel with the maintainer.

        Do not identify the affected component or revision. Do not include a summary, reproduction, impact, logs, project state, paths, references, credentials, screenshots, or links. The maintainer will reply with an alternate private route; share technical information only there.
  - type: checkboxes
    id: metadata_only
    attributes:
      label: Metadata-only safety check
      options:
        - label: I am requesting only a private reporting route, and this issue contains no vulnerability or technical details.
          required: true
