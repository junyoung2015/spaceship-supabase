name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z or vX.Y.Z-beta.N tag to recover a failed publication.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Reusable release gate
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This is deliberately the only job in the release pipeline with write
    # access, and it runs only after all reusable CI gates are green.
    permissions:
      contents: write
    steps:
      - name: Check out complete tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zsh
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Recheck annotated tag and write curated release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/spaceship-supabase-release-notes.md
        run: zsh -f .github/scripts/release-preflight.zsh "$RELEASE_TAG"

      - name: Reject duplicate release immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: zsh -f .github/scripts/release-duplicate-check.zsh "$RELEASE_TAG"

      - name: Create the correctly classified GitHub Release from the curated changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/spaceship-supabase-release-notes.md
        shell: bash
        run: zsh -f .github/scripts/release-create.zsh "$RELEASE_TAG"
